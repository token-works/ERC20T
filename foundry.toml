[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 1
cbor_metadata = false
bytecode_hash = "none"
auto_detect_remappings = false

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
robinhood = "https://rpc.mainnet.chain.robinhood.com"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
robinhood = { key = "${ETHERSCAN_API_KEY}", chain = 4663, url = "https://api.etherscan.io/v2/api?chainid=4663" }
